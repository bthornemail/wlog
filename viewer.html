<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOLOG Viewer</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: "Arvo", "Georgia", serif; background: #0d1117; color: #e6edf3; }
    #header { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    #header h1 { margin: 0; font-size: 18px; color: #58a6ff; }
    select, button { padding: 6px 12px; border-radius: 6px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; cursor: pointer; font-size: 13px; }
    button:hover { background: #30363d; }
    #container { height: calc(100vh - 200px); width: 100%; }
    #stream-panel { height: 150px; border-top: 1px solid #30363d; display: flex; background: #0d1117; }
    #clock-grid { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; overflow: auto; align-content: flex-start; }
    #stream-log { width: 300px; border-left: 1px solid #30363d; padding: 10px; overflow: auto; font-family: "JetBrains Mono", monospace; font-size: 11px; }
    .log-entry { margin: 2px 0; }
    .log-bom { color: #c084fc; }
    .log-null { color: #22d3ee; }
    .log-esc { color: #fbbf24; }
    .log-state { color: #34d399; }
    .info { position: absolute; bottom: 10px; left: 10px; font-size: 12px; color: #8b949e; }
    wlog-clock-node { display: inline-block; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header">
    <h1>WOLOG Viewer</h1>
    <select id="graph-select">
      <option value="fixtures/pg/wlog-terms.pg">Constitutional Terms</option>
      <option value="fixtures/pg/small3.pg">Small 3-Node</option>
      <option value="fixtures/pg/knows.pg">Knows Edge</option>
      <option value="fixtures/pg/person.pg">Person</option>
    </select>
    <button id="addClockBtn">Add Clock</button>
    <button id="streamBtn">Stream</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div id="container"></div>

  <div id="stream-panel">
    <div id="clock-grid"></div>
    <div id="stream-log">
      <div style="color: #8b949e; margin-bottom: 8px;">UTF-32 Protocol Log</div>
      <div id="log-content"></div>
    </div>
  </div>

  <div class="info">WOLOG: graph viewer and stream surface</div>

  <script type="module" src="/apps/viewer.ts"></script>
</body>
</html>
