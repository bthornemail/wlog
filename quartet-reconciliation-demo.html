<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOLOG Quartet Reconciliation Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --ink: #111827;
        --muted: #475569;
        --card: #ffffff;
        --line: #dbe2ea;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 10% 10%, #dbeafe 0%, var(--bg) 45%);
        color: var(--ink);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      #app {
        max-width: 1080px;
        margin: 24px auto 64px;
        padding: 0 20px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        margin-bottom: 14px;
      }
      h1, h2 { margin: 0 0 10px; }
      p { margin: 8px 0 0; color: var(--muted); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
      pre {
        margin: 0;
        max-height: 360px;
        overflow: auto;
        background: #0f172a;
        color: #d1fae5;
        border-radius: 10px;
        padding: 12px;
        font-family: "IBM Plex Mono", "Cascadia Code", monospace;
        font-size: 12px;
      }
      .svg-wrap {
        background: #f8fafc;
        border: 1px dashed #93c5fd;
        border-radius: 10px;
        padding: 8px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/apps/quartet-reconciliation-demo.ts"></script>
  </body>
</html>
