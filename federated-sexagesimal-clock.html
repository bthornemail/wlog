<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Federated Sexagesimal Clock | Web Components</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#05050A;font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#0A0A12] text-gray-200 min-h-screen flex flex-col">

<header class="p-6 border-b border-purple-500/20">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">
        Federated Sexagesimal Clock
    </h1>
    <p class="text-slate-400 text-sm mt-1">Multi-instance with step offsets • Web Components</p>
</header>

<div class="p-4 bg-black/20 border-b border-purple-500/20 flex flex-wrap gap-4 items-center">
    <button id="addBtn" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-sm">+ Add Node</button>
    <button id="syncBtn" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded-lg text-sm">Sync All</button>
    <button id="resetBtn" class="px-4 py-2 bg-amber-600 rounded-lg text-sm">Reset</button>
    <div class="flex-1"></div>
    <span id="count" class="text-purple-400">0 nodes</span>
</div>

<main class="flex-1 p-4">
    <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Web components injected here -->
    </div>
</main>

<footer class="p-4 border-t border-purple-500/20 text-xs text-slate-500">
    <p>Each node has a unique phase offset (multiples of 840) for federated timing.</p>
</footer>

<script src="components/clock-node.js"></script>
<script>
const grid = document.getElementById('grid');
const count = document.getElementById('count');
const nodes = [];
const channel = new BroadcastChannel('wlog-fed');
let nodeId = 0;

channel.onmessage = (e) => {
    if (e.data.type === 'SYNC') {
        nodes.forEach(n => n.clock.tick = e.data.tick);
    }
};

function addNode() {
    nodeId++;
    const clock = document.createElement('wlog-clock-node');
    clock.setAttribute('offset', (nodeId - 1) * 840);
    clock.setAttribute('label', 'NODE' + nodeId);
    clock.style.height = '120px';
    grid.appendChild(clock);
    nodes.push({ id: nodeId, clock });
    count.textContent = `${nodes.length} nodes`;
}

function syncAll() {
    if (nodes.length === 0) return;
    channel.postMessage({ type: 'SYNC', tick: nodes[0].clock.tick });
}

function reset() {
    nodes.forEach(n => n.clock.remove());
    nodes.length = 0;
    nodeId = 0;
    grid.innerHTML = '';
    count.textContent = '0 nodes';
}

document.getElementById('addBtn').onclick = addNode;
document.getElementById('syncBtn').onclick = syncAll;
document.getElementById('resetBtn').onclick = reset;

// Start with 3 nodes
addNode(); addNode(); addNode();
</script>
</body>
</html>
