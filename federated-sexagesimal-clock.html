<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Federated Sexagesimal Abacus Clock | Wallis Coordination Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,800&family=JetBrains+Mono:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', 'JetBrains Mono', monospace;
            background: #05050A;
        }
        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }
        .aegean-text {
            font-family: 'Segoe UI Historic', 'Noto Sans Anatolian Hieroglyphs', 'Noto Sans Symbols2', 'Segoe UI Symbol', monospace;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #2c3e66;
            border-radius: 4px;
        }
        .radial-sync {
            background: radial-gradient(circle at center, rgba(59,130,246,0.2) 0%, rgba(0,0,0,0) 80%);
        }
        .abacus-rod {
            transition: all 0.12s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .vertical-writing {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        @keyframes subtlePulse {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }
        .pulse-sync {
            animation: subtlePulse 0.8s ease-out;
        }
        @keyframes federationPulse {
            0% { border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            100% { border-color: rgba(139, 92, 246, 0.8); box-shadow: 0 0 20px 5px rgba(139, 92, 246, 0.6); }
        }
        .federation-active {
            animation: federationPulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#0A0A12] text-gray-200 antialiased overflow-x-hidden">

<div id="root" class="min-h-screen flex flex-col"></div>

<script>
    // --------------------------------------------------------------
    // FEDERATED SEXAGESIMAL ABACUS CLOCK – WALLIS COORDINATION ENGINE
    // Master Period: 5040 (7!), Base-60 embedded logic, τ₇ x τ₁₅ intersection
    // NEW: Step offset for federation (phase offset between distributed instances)
    // --------------------------------------------------------------

    // --- Core Constants (Atomic Timing) ---
    const MASTER_PERIOD = 5040;      // 7! full cycle
    const SEXA_BASE = 60;            // base-60 sexagesimal
    const GOAL_CYCLE = 360;          // degrees
    const SONAR_PERIOD = 60;         // τ₁₅ sonar sweep (60 slots)
    const FANO_PERIOD = 7;           // τ₇ Fano selection
    const SYNC_UNIT = 120;           // coherence pulse resolution
    
    // Fano projective lines (7 points, 7 lines)
    const FANO_LINES = [
        [0, 1, 3], [0, 2, 5], [0, 4, 6],
        [1, 2, 4], [1, 5, 6],
        [2, 3, 6],
        [3, 4, 5]
    ];
    
    // Unicode Aegean numbers (units 1-9, tens 10-90, hundreds 100-900)
    const AEGEAN_UNITS = [0x10107, 0x10108, 0x10109, 0x1010A, 0x1010B, 0x1010C, 0x1010D, 0x1010E, 0x1010F];
    const AEGEAN_TENS = [0x10110, 0x10111, 0x10112, 0x10113, 0x10114, 0x10115, 0x10116, 0x10117, 0x10118];
    const AEGEAN_HUNDREDS = [0x10119, 0x1011A, 0x1011B, 0x1011C, 0x1011D, 0x1011E, 0x1011F, 0x10120, 0x10121];
    
    // Helper: Aegean tally for any integer (0-999)
    function toAegeanTally(num) {
        if (num === 0) return "𐄇";
        let n = Math.floor(Math.abs(num));
        let result = "";
        const hundreds = Math.floor(n / 100) % 10;
        if (hundreds > 0 && hundreds <= 9) result += String.fromCodePoint(AEGEAN_HUNDREDS[hundreds - 1]);
        const tens = Math.floor((n % 100) / 10);
        if (tens > 0 && tens <= 9) result += String.fromCodePoint(AEGEAN_TENS[tens - 1]);
        const units = n % 10;
        if (units > 0 && units <= 9) result += String.fromCodePoint(AEGEAN_UNITS[units - 1]);
        return result || "𐄇";
    }
    
    // Wallis sexagesimal decomposition (tick -> 60^2 : 60^1 : 60^0)
    function getWallisDecomp(tick) {
        const doublePrimes = Math.floor(tick / 3600);
        const primes = Math.floor((tick % 3600) / 60);
        const units = tick % 60;
        return { u: units, p: primes, dp: doublePrimes, 
                 str: `${doublePrimes}‵‵ ${primes}‵ ${units}°` };
    }
    
    function toBraille8(val) {
        return String.fromCharCode(0x2800 + (Math.abs(val) % 256));
    }
    
    function toHexagram(val) {
        return String.fromCodePoint(0x4DC0 + (Math.abs(val) % 64));
    }
    
    function toBraille6(val) {
        return String.fromCharCode(0x2800 + (Math.abs(val) % 64));
    }
    
    // --- Federated Clock Manager ---
    class SexagesimalAbacusClock {
        constructor(container) {
            this.container = container;
            this.masterTick = 0;           // absolute master clock (0..5039)
            this.offset = 0;                // federation offset (0..5039)
            this.isRunning = true;
            this.speed = 100;
            this.timer = null;
            
            this.updateUI = this.updateUI.bind(this);
            this.tickStep = this.tickStep.bind(this);
            
            this.init();
        }
        
        // Returns the federated tick (master + offset, wrapped)
        get federatedTick() {
            return (this.masterTick + this.offset) % MASTER_PERIOD;
        }
        
        init() {
            this.render();
            this.startClock();
        }
        
        tickStep() {
            if (!this.isRunning) return;
            this.masterTick = (this.masterTick + 1) % MASTER_PERIOD;
            this.updateUI();
        }
        
        startClock() {
            if (this.timer) clearInterval(this.timer);
            this.timer = setInterval(() => this.tickStep(), this.speed);
        }
        
        stopClock() {
            if (this.timer) clearInterval(this.timer);
            this.timer = null;
        }
        
        setRunning(run) {
            this.isRunning = run;
            if (run) {
                this.startClock();
            } else {
                this.stopClock();
            }
            this.updateUI();
        }
        
        setSpeed(val) {
            this.speed = val;
            if (this.isRunning) {
                this.stopClock();
                this.startClock();
            }
            this.updateUI();
        }
        
        setOffset(val) {
            this.offset = Math.max(0, Math.min(MASTER_PERIOD - 1, val));
            this.updateUI();
        }
        
        resetClock() {
            this.masterTick = 0;
            this.updateUI();
        }
        
        // get derived state using federated tick for visual display
        getDerived(useFederated = true) {
            const displayTick = useFederated ? this.federatedTick : this.masterTick;
            const tick = displayTick;
            
            const phase = tick % SONAR_PERIOD;
            const channel = Math.floor(phase / 15);
            const lane = phase % 15;
            const fanoPhase = tick % FANO_PERIOD;
            const triplet = FANO_LINES[fanoPhase];
            const wallis = getWallisDecomp(tick);
            
            const seed = (lane * 3 + fanoPhase * 2) % 256;
            let projectionChar = "⚛️";
            let projectionSub = "ABACUS";
            switch(channel) {
                case 0: 
                    projectionChar = (seed % 16).toString(16).toUpperCase();
                    projectionSub = `HEX_${seed}`;
                    break;
                case 1:
                    projectionChar = toBraille6(seed);
                    projectionSub = `BRAILLE6_${seed}`;
                    break;
                case 2:
                    projectionChar = toBraille8(seed);
                    projectionSub = `BRAILLE8_${seed}`;
                    break;
                case 3:
                    projectionChar = toHexagram(seed);
                    projectionSub = `HEXAGRAM_${seed % 64}`;
                    break;
                default: projectionChar = "◇";
            }
            
            const sPhase = tick % SONAR_PERIOD;
            const fPhase = tick % FANO_PERIOD;
            const diff = Math.abs((sPhase * FANO_PERIOD) - (fPhase * SONAR_PERIOD)) % 420;
            const alignment = 1.0 - (diff / 420);
            const goalProgress = (tick % GOAL_CYCLE) / GOAL_CYCLE;
            
            const abacusBeads = {
                high: wallis.dp % 60,
                mid: wallis.p,
                low: wallis.u
            };
            
            const aegeanWitness = {
                high: toAegeanTally(abacusBeads.high),
                mid: toAegeanTally(abacusBeads.mid),
                low: toAegeanTally(abacusBeads.low)
            };
            
            // Calculate phase difference between master and federated (for federation visualization)
            const phaseDifference = this.offset;
            const isFederated = this.offset !== 0;
            
            return { 
                masterTick: this.masterTick,
                federatedTick: this.federatedTick,
                offset: this.offset,
                displayTick: tick,
                wallis, sonar: { phase, channel, lane }, 
                fano: { phase: fanoPhase, triplet }, 
                alignment, goalProgress, projectionChar, projectionSub, 
                abacusBeads, aegeanWitness,
                isSyncPulse: tick % SYNC_UNIT === 0,
                phaseDifference,
                isFederated
            };
        }
        
        updateUI() {
            if (!this.container) return;
            const data = this.getDerived(true);
            this.renderDOM(data);
        }
        
        renderDOM(data) {
            const { masterTick, federatedTick, offset, displayTick, wallis, sonar, fano, alignment, 
                    goalProgress, projectionChar, projectionSub, abacusBeads, aegeanWitness, 
                    isSyncPulse, phaseDifference, isFederated } = data;
            
            const fanoActive = fano.triplet || [];
            const coherencePct = Math.floor(alignment * 100);
            const isHighCoherence = alignment > 0.85;
            
            const html = `
                <div class="max-w-7xl mx-auto px-4 py-6 md:py-8 w-full">
                    <!-- Wallis Aegean Header with Federation Badge -->
                    <div class="flex flex-wrap justify-between items-center gap-4 border-b border-indigo-900/50 pb-5 mb-6">
                        <div class="flex items-center gap-3">
                            <span class="text-5xl aegean-text text-blue-400 drop-shadow-lg">${aegeanWitness.high}</span>
                            <div>
                                <div class="text-[9px] font-black tracking-[0.3em] text-indigo-400/60 uppercase">Mathesis Universalis</div>
                                <div class="text-xl font-mono font-bold tracking-tight text-slate-200">${wallis.dp}‵‵ ${wallis.p}‵</div>
                            </div>
                        </div>
                        <div class="text-center">
                            <h1 class="text-[11px] font-black tracking-[0.4em] text-cyan-400/50 uppercase">FEDERATED ABACUS CLOCK</h1>
                            <p class="text-[9px] font-mono text-emerald-400/70 mt-1">τ₇ ∩ τ₁₅ • 7! = 5040 • Distributed Ensemble</p>
                        </div>
                        <div class="flex items-center gap-3 text-right">
                            ${isFederated ? `
                                <div class="px-3 py-1 rounded-full bg-purple-500/20 border border-purple-500/40">
                                    <span class="text-[8px] font-black text-purple-300 uppercase tracking-wider">Federated</span>
                                </div>
                            ` : ''}
                            <div>
                                <div class="text-[9px] font-black tracking-wider text-slate-500 uppercase">Unit Degree</div>
                                <div class="text-xl font-mono font-bold text-white/80">${wallis.u}°</div>
                            </div>
                            <span class="text-5xl aegean-text text-emerald-400">${aegeanWitness.low}</span>
                        </div>
                    </div>
                    
                    <!-- FEDERATION STATUS PANEL -->
                    <div class="mb-6 p-4 rounded-xl ${isFederated ? 'bg-purple-950/30 border border-purple-500/30 federation-active' : 'bg-gray-900/30 border border-gray-700/50'} transition-all duration-300">
                        <div class="flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-3 h-3 rounded-full ${isFederated ? 'bg-purple-500 animate-pulse' : 'bg-gray-500'}"></div>
                                <span class="text-xs font-mono font-bold uppercase tracking-wider">Federation Status</span>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                                <div>
                                    <div class="text-[9px] text-slate-400">Master Tick</div>
                                    <div class="text-lg font-mono font-bold text-blue-400">${masterTick}</div>
                                </div>
                                <div>
                                    <div class="text-[9px] text-slate-400">Offset</div>
                                    <div class="text-lg font-mono font-bold text-purple-400">+ ${offset}</div>
                                </div>
                                <div>
                                    <div class="text-[9px] text-slate-400">Federated Tick</div>
                                    <div class="text-lg font-mono font-bold text-emerald-400">${federatedTick}</div>
                                </div>
                                <div>
                                    <div class="text-[9px] text-slate-400">Phase Shift</div>
                                    <div class="text-lg font-mono font-bold text-amber-400">${Math.floor((phaseDifference / MASTER_PERIOD) * 360)}°</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- ABACUS CORE: Sexagesimal Beads (3 rods) -->
                    <div class="grid lg:grid-cols-3 gap-6 mb-8">
                        ${['high', 'mid', 'low'].map((rod, idx) => {
                            const labels = ['Double Prime Rod', 'Prime Rod', 'Unit Rod'];
                            const colors = ['indigo', 'cyan', 'emerald'];
                            const value = abacusBeads[rod];
                            const aegean = aegeanWitness[rod];
                            return `
                                <div class="bg-gradient-to-br from-gray-900/80 to-gray-950 border border-gray-800 rounded-2xl p-5 backdrop-blur-sm shadow-xl">
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-[10px] font-black uppercase tracking-widest text-${colors[idx]}-400">${labels[idx]}</span>
                                        <span class="text-2xl aegean-text text-${colors[idx]}-300">${aegean}</span>
                                    </div>
                                    <div class="abacus-rod flex flex-wrap gap-2 items-center justify-center min-h-[100px] bg-black/40 rounded-xl p-4">
                                        ${this.renderAbacusBeads(value, 60, rod)}
                                    </div>
                                    <div class="text-center mt-3 font-mono text-xs text-slate-500">value: ${value} / 59</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <!-- MAIN PROJECTION SURFACE -->
                    <div class="relative rounded-3xl border border-white/5 bg-black/30 backdrop-blur-sm overflow-hidden mb-8">
                        <div class="absolute inset-0 pointer-events-none transition-opacity duration-700 ${isSyncPulse ? 'opacity-100' : 'opacity-0'}">
                            <div class="absolute inset-0 bg-blue-600/20 blur-3xl"></div>
                        </div>
                        ${isFederated ? `
                            <div class="absolute top-4 right-4 z-20 px-3 py-1 bg-purple-500/30 backdrop-blur-sm rounded-full text-[9px] font-mono text-purple-200 border border-purple-400/40">
                                FEDERATED NODE
                            </div>
                        ` : ''}
                        <div class="relative z-10 flex flex-col items-center justify-center py-12 md:py-20">
                            <div class="text-[28vw] md:text-[30vh] leading-none font-mono transition-all duration-200 ${isHighCoherence ? 'scale-105 drop-shadow-[0_0_35px_rgba(59,130,246,0.6)]' : ''}">
                                <span class="select-none text-slate-100">${projectionChar}</span>
                            </div>
                            <div class="mt-6 bg-white/5 backdrop-blur-md px-6 py-3 rounded-full border border-white/10">
                                <span class="text-2xl font-mono font-bold tracking-wider text-cyan-300">${projectionSub}</span>
                            </div>
                            <div class="flex gap-4 mt-4 text-[10px] font-mono text-slate-400">
                                <span>Channel ${sonar.channel} · Lane ${sonar.lane}</span>
                                <span>| Fano Phase ${fano.phase}/6</span>
                                <span>| Alignment ${coherencePct}%</span>
                            </div>
                        </div>
                        
                        <div class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 flex flex-col gap-2">
                            <div class="text-[8px] font-black uppercase tracking-wider text-indigo-400/50 vertical-writing mb-2">Fano Triplet</div>
                            ${[0,1,2,3,4,5,6].map(p => `
                                <div class="w-1.5 transition-all duration-300 ${fanoActive.includes(p) ? 'bg-blue-500 h-8 shadow-[0_0_12px_#3b82f6]' : 'bg-white/10 h-4'} rounded-full"></div>
                            `).join('')}
                        </div>
                        
                        <div class="absolute bottom-0 left-0 w-full h-1.5 bg-white/5">
                            <div class="h-full bg-emerald-500 transition-all duration-150" style="width: ${(sonar.phase / SONAR_PERIOD) * 100}%; box-shadow: 0 0 8px #10b981;"></div>
                        </div>
                    </div>
                    
                    <!-- Coordination Dashboard -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-neutral-900/60 border border-neutral-800 rounded-xl p-4">
                            <div class="text-[9px] text-slate-400 uppercase tracking-wider">Goal Cycle (360°)</div>
                            <div class="flex items-baseline gap-2 mt-1">
                                <span class="text-2xl font-mono font-bold text-amber-400">${Math.floor(goalProgress * 360)}°</span>
                                <span class="text-xs text-slate-500">/360</span>
                            </div>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div class="bg-amber-500 h-full rounded-full" style="width: ${goalProgress * 100}%"></div>
                            </div>
                        </div>
                        <div class="bg-neutral-900/60 border border-neutral-800 rounded-xl p-4">
                            <div class="text-[9px] text-slate-400 uppercase tracking-wider">Display Tick</div>
                            <div class="text-2xl font-mono font-bold text-white">${displayTick} <span class="text-sm text-slate-500">/ ${MASTER_PERIOD}</span></div>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div class="bg-blue-500 h-full" style="width: ${(displayTick / MASTER_PERIOD) * 100}%"></div>
                            </div>
                        </div>
                        <div class="bg-neutral-900/60 border border-neutral-800 rounded-xl p-4">
                            <div class="text-[9px] text-slate-400 uppercase tracking-wider">Coherence State</div>
                            <div class="text-2xl font-mono font-bold ${coherencePct > 80 ? 'text-emerald-400' : 'text-amber-400'}">${coherencePct}%</div>
                            <div class="text-[9px] font-mono mt-1">${isHighCoherence ? 'SYNC LOCK' : 'DRIFT MODULATION'}</div>
                        </div>
                        <div class="bg-neutral-900/60 border border-neutral-800 rounded-xl p-4">
                            <div class="text-[9px] text-slate-400 uppercase tracking-wider">Incidence Type</div>
                            <div class="text-sm font-mono flex items-center gap-2 mt-1"><span class="text-blue-400">τ₇</span> ∩ <span class="text-emerald-400">τ₁₅</span></div>
                            <div class="text-[10px] text-slate-500 mt-1">${isFederated ? 'Federated Ensemble' : 'Standalone Node'}</div>
                        </div>
                    </div>
                    
                    <!-- CONTROLS: Clock + Federation Offset -->
                    <div class="flex flex-wrap items-center justify-between gap-4 p-4 bg-black/40 rounded-2xl border border-white/5">
                        <div class="flex items-center gap-3">
                            <button id="playPauseBtn" class="px-5 py-2 rounded-xl font-bold text-sm transition-all ${this.isRunning ? 'bg-amber-600/80 text-white hover:bg-amber-700' : 'bg-blue-600 text-white hover:bg-blue-700'} flex items-center gap-2">
                                <i data-lucide="${this.isRunning ? 'pause' : 'play'}" class="w-4 h-4"></i>
                                ${this.isRunning ? 'HALT' : 'START'}
                            </button>
                            <button id="resetBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-mono transition">⟳ RESET MASTER</button>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] text-slate-400">SPEED</span>
                                <input type="range" id="speedSlider" min="30" max="400" value="${this.speed}" step="10" class="w-28 accent-blue-500" />
                                <span class="text-xs font-mono text-slate-300 w-12">${this.speed}ms</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- FEDERATION OFFSET CONTROLLER -->
                    <div class="mt-4 p-4 bg-purple-950/20 rounded-xl border border-purple-500/20">
                        <div class="flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-2">
                                <i data-lucide="network" class="w-4 h-4 text-purple-400"></i>
                                <span class="text-xs font-mono font-bold uppercase tracking-wider text-purple-300">Federation Offset</span>
                            </div>
                            <div class="flex-1 max-w-md">
                                <input type="range" id="offsetSlider" min="0" max="${MASTER_PERIOD - 1}" value="${offset}" step="1" class="w-full accent-purple-500" />
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="number" id="offsetNumber" min="0" max="${MASTER_PERIOD - 1}" value="${offset}" class="w-24 px-2 py-1 bg-black/60 border border-purple-500/40 rounded-lg text-sm font-mono text-purple-300 text-center" />
                                <button id="clearOffsetBtn" class="px-3 py-1 text-xs bg-gray-700 hover:bg-gray-600 rounded-lg transition">Clear</button>
                            </div>
                        </div>
                        <div class="mt-2 text-[9px] font-mono text-purple-400/70 text-center">
                            Offset shifts this node's phase relative to master clock. Use for distributed federation, load balancing, or multi-agent coordination.
                        </div>
                    </div>
                    
                    <!-- Foot note -->
                    <div class="mt-6 text-center text-[9px] font-mono text-slate-600 border-t border-white/5 pt-5">
                        FEDERATED WALLIS SEXAGESIMAL • τ₇:τ₁₅ INTERSECTION • DISTRIBUTED ENSEMBLE READY • MASTER 7! = 5040
                    </div>
                </div>
            `;
            
            this.container.innerHTML = html;
            
            if (window.lucide) {
                window.lucide.createIcons();
            }
            
            // Bind controls
            document.getElementById('playPauseBtn')?.addEventListener('click', () => this.setRunning(!this.isRunning));
            document.getElementById('resetBtn')?.addEventListener('click', () => this.resetClock());
            document.getElementById('speedSlider')?.addEventListener('input', (e) => this.setSpeed(parseInt(e.target.value)));
            document.getElementById('offsetSlider')?.addEventListener('input', (e) => this.setOffset(parseInt(e.target.value)));
            document.getElementById('offsetNumber')?.addEventListener('input', (e) => this.setOffset(parseInt(e.target.value) || 0));
            document.getElementById('clearOffsetBtn')?.addEventListener('click', () => this.setOffset(0));
        }
        
        renderAbacusBeads(value, maxVal, rodId) {
            const totalBeads = 60;
            const activeCount = Math.min(maxVal - 1, value);
            const colorMap = { high: 'indigo', mid: 'cyan', low: 'emerald' };
            const color = colorMap[rodId] || 'gray';
            let beadsHtml = '';
            for (let i = 0; i < totalBeads; i++) {
                const isActive = i < activeCount;
                beadsHtml += `<div class="w-4 h-4 rounded-full transition-all duration-200 ${isActive ? `bg-${color}-500/80 shadow-md` : 'bg-gray-700/40'}"></div>`;
            }
            return beadsHtml;
        }
        
        render() {
            const initialData = this.getDerived(true);
            this.renderDOM(initialData);
        }
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('root');
        if (container) {
            window.abacusClock = new SexagesimalAbacusClock(container);
        }
        if (window.lucide) {
            window.lucide.createIcons();
        }
    });
</script>
</body>
