<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTF-32 Stream Protocol | Web Components</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#05050A;font-family:'JetBrains Mono',monospace}</style>
</head>
<body class="bg-[#0A0A12] text-gray-200 min-h-screen flex flex-col">

<header class="p-6 border-b border-purple-500/20">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
        UTF-32 Stream Protocol
    </h1>
    <p class="text-slate-400 text-sm mt-1">BOM/NULL/ESC Signaling Layer • Web Components</p>
</header>

<div class="p-4 bg-black/20 border-b border-purple-500/20">
    <div class="grid grid-cols-4 gap-4 text-xs">
        <div class="bg-black/30 p-2 rounded">
            <div class="text-purple-400">BOM (0xFEFF)</div>
            <div>Session boundary</div>
        </div>
        <div class="bg-black/30 p-2 rounded">
            <div class="text-cyan-400">NULL (0x0000)</div>
            <div>Clock tick</div>
        </div>
        <div class="bg-black/30 p-2 rounded">
            <div class="text-amber-400">ESC (0x001B)</div>
            <div>Signal follows</div>
        </div>
        <div class="bg-black/30 p-2 rounded">
            <div class="text-emerald-400">STATE</div>
            <div>Payload data</div>
        </div>
    </div>
</div>

<div class="p-4 bg-black/20 border-b border-purple-500/20 flex flex-wrap gap-4 items-center">
    <button id="addBtn" class="px-4 py-2 bg-purple-600 rounded-lg text-sm">+ Add Node</button>
    <button id="streamBtn" class="px-4 py-2 bg-cyan-600 rounded-lg text-sm">Stream</button>
    <button id="resetBtn" class="px-4 py-2 bg-amber-600 rounded-lg text-sm">Reset</button>
    <div class="flex-1"></div>
    <span id="streamStatus" class="text-cyan-400">Idle</span>
</div>

<main class="flex-1 p-4">
    <div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
</main>

<aside class="h-48 border-t border-purple-500/20 p-4 overflow-y-auto">
    <div class="text-xs text-purple-400 mb-2">Protocol Log</div>
    <div id="log" class="font-mono text-[10px] space-y-1"></div>
</aside>

<script src="components/clock-node.js"></script>
<script>
const grid = document.getElementById('grid');
const log = document.getElementById('log');
const nodes = [];
const channel = new BroadcastChannel('wlog-protocol');
let nodeId = 0;

// Stream protocol constants
const PROTOCOL = { BOM: 0xFEFF, NULL: 0x0000, ESC: 0x001B };

channel.onmessage = (e) => {
    if (e.data.type === 'BOM') logMsg('BOM', 'Session reset', 'purple');
    else if (e.data.type === 'NULL') logMsg('NULL', `tick ${e.data.tick}`, 'cyan');
    else if (e.data.type === 'ESC') logMsg('ESC', 'Signal follows', 'amber');
};

function logMsg(type, msg, color) {
    const entry = document.createElement('div');
    entry.innerHTML = `<span class="text-${color}">[${type}]</span> ${msg}`;
    log.insertBefore(entry, log.firstChild);
    while (log.children.length > 20) log.lastChild.remove();
}

function addNode() {
    nodeId++;
    const clock = document.createElement('wlog-clock-node');
    clock.setAttribute('offset', (nodeId - 1) * 840);
    clock.setAttribute('label', 'STREAM' + nodeId);
    clock.style.height = '120px';
    
    // Emit protocol events on tick
    clock.addEventListener('tick', (e) => {
        const tick = e.detail.federatedTick;
        
        // NULL on every tick
        if (tick % 1 === 0) {
            channel.postMessage({ type: 'NULL', tick });
            logMsg('NULL', tick, 'cyan');
        }
        
        // ESC every 60 ticks
        if (tick % 60 === 0 && tick > 0) {
            channel.postMessage({ type: 'ESC', tick, payload: { state: 'HEARTBEAT' } });
            logMsg('ESC', `payload at ${tick}`, 'amber');
        }
        
        // BOM every 504 ticks
        if (tick % 504 === 0 && tick > 0) {
            channel.postMessage({ type: 'BOM', tick });
            logMsg('BOM', `session reset at ${tick}`, 'purple');
        }
    });
    
    grid.appendChild(clock);
    nodes.push({ id: nodeId, clock });
}

function broadcastStream() {
    document.getElementById('streamStatus').textContent = 'Streaming...';
    channel.postMessage({ type: 'BOM', tick: 0 });
    logMsg('BOM', 'Stream started', 'purple');
}

function reset() {
    nodes.forEach(n => n.clock.remove());
    nodes.length = 0;
    nodeId = 0;
    grid.innerHTML = '';
    log.innerHTML = '';
    document.getElementById('streamStatus').textContent = 'Idle';
}

document.getElementById('addBtn').onclick = addNode;
document.getElementById('streamBtn').onclick = broadcastStream;
document.getElementById('resetBtn').onclick = reset;

addNode(); addNode();
</script>
</body>
</html>
