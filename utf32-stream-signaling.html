<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stream-Ready Federated Abacus Clock | UTF-32 Signaling Layer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,800&family=JetBrains+Mono:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', 'JetBrains Mono', monospace;
            background: #05050A;
        }
        .aegean-text {
            font-family: 'Segoe UI Historic', 'Noto Sans Anatolian Hieroglyphs', 'Noto Sans Symbols2', 'Segoe UI Symbol', monospace;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #2c3e66; border-radius: 4px; }
        .vertical-writing {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        @keyframes federationPulse {
            0% { border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            100% { border-color: rgba(139, 92, 246, 0.8); box-shadow: 0 0 20px 5px rgba(139, 92, 246, 0.6); }
        }
        .federation-active { animation: federationPulse 1.5s ease-in-out infinite; }
        @keyframes tickFlash {
            0% { background-color: rgba(16, 185, 129, 0); }
            50% { background-color: rgba(16, 185, 129, 0.3); }
            100% { background-color: rgba(16, 185, 129, 0); }
        }
        .tick-flash { animation: tickFlash 0.15s ease-out; }
        .stream-log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            line-height: 1.5;
        }
        .stream-log::-webkit-scrollbar { width: 3px; }
    </style>
</head>
<body class="bg-[#0A0A12] text-gray-200 antialiased overflow-x-hidden">

<div id="root" class="min-h-screen flex flex-col"></div>

<script>
    // --------------------------------------------------------------
    // STREAM-READY FEDERATED ABACUS CLOCK
    // Protocol: UTF-32 stream with BOM/NULL/ESC signaling
    // BOM (U+FEFF) = Session boundary / reset
    // NULL (U+0000) = Clock tick (pure timing pulse)
    // ESC (U+001B) = Signal follows (escaped payload)
    // --------------------------------------------------------------

    const MASTER_PERIOD = 5040;
    const SONAR_PERIOD = 60;
    const FANO_PERIOD = 7;
    const GOAL_CYCLE = 360;
    const SYNC_UNIT = 120;

    const FANO_LINES = [
        [0, 1, 3], [0, 2, 5], [0, 4, 6],
        [1, 2, 4], [1, 5, 6],
        [2, 3, 6],
        [3, 4, 5]
    ];

    const AEGEAN_UNITS = [0x10107, 0x10108, 0x10109, 0x1010A, 0x1010B, 0x1010C, 0x1010D, 0x1010E, 0x1010F];
    const AEGEAN_TENS = [0x10110, 0x10111, 0x10112, 0x10113, 0x10114, 0x10115, 0x10116, 0x10117, 0x10118];
    const AEGEAN_HUNDREDS = [0x10119, 0x1011A, 0x1011B, 0x1011C, 0x1011D, 0x1011E, 0x1011F, 0x10120, 0x10121];

    function toAegeanTally(num) {
        if (num === 0) return "𐄇";
        let n = Math.floor(Math.abs(num));
        let result = "";
        const hundreds = Math.floor(n / 100) % 10;
        if (hundreds > 0) result += String.fromCodePoint(AEGEAN_HUNDREDS[hundreds - 1]);
        const tens = Math.floor((n % 100) / 10);
        if (tens > 0) result += String.fromCodePoint(AEGEAN_TENS[tens - 1]);
        const units = n % 10;
        if (units > 0) result += String.fromCodePoint(AEGEAN_UNITS[units - 1]);
        return result || "𐄇";
    }

    function getWallisDecomp(tick) {
        const doublePrimes = Math.floor(tick / 3600);
        const primes = Math.floor((tick % 3600) / 60);
        const units = tick % 60;
        return { u: units, p: primes, dp: doublePrimes };
    }

    function toBraille8(val) { return String.fromCharCode(0x2800 + (Math.abs(val) % 256)); }
    function toHexagram(val) { return String.fromCodePoint(0x4DC0 + (Math.abs(val) % 64)); }
    function toBraille6(val) { return String.fromCharCode(0x2800 + (Math.abs(val) % 64)); }

    // --- UTF-32 Stream Protocol ---
    const PROTOCOL = {
        BOM: { code: 0xFEFF, name: 'BOM', char: '\uFEFF', desc: 'Session Boundary / Reset' },
        NULL: { code: 0x0000, name: 'NULL', char: '\u0000', desc: 'Clock Tick (Pure Timing)' },
        ESC: { code: 0x001B, name: 'ESC', char: '\u001B', desc: 'Escape / Signal Follows' }
    };

    class StreamTracer {
        constructor(maxEntries = 100) {
            this.entries = [];
            this.maxEntries = maxEntries;
            this.listeners = [];
        }

        addEntry(type, data = null, tick = null) {
            const entry = {
                id: Date.now() + Math.random(),
                timestamp: new Date().toISOString().slice(11, 23),
                type, // 'BOM', 'NULL', 'ESC', 'SIGNAL'
                data,
                tick,
                utf32Hex: this.toUTF32Hex(type === 'SIGNAL' ? data : PROTOCOL[type]?.code)
            };
            this.entries.unshift(entry);
            if (this.entries.length > this.maxEntries) this.entries.pop();
            this.notify();
            return entry;
        }

        toUTF32Hex(codePoint) {
            if (codePoint === null || codePoint === undefined) return '—';
            const bytes = new Uint8Array(4);
            const le = codePoint & 0xFF;
            const be = (codePoint >> 24) & 0xFF;
            return `LE:${le.toString(16).padStart(2, '0').toUpperCase()} BE:${be.toString(16).padStart(2, '0').toUpperCase()}`;
        }

        addSignal(signalType, payload, tick) {
            return this.addEntry('SIGNAL', { type: signalType, payload }, tick);
        }

        clear() {
            this.entries = [];
            this.notify();
        }

        subscribe(callback) {
            this.listeners.push(callback);
            callback(this.entries);
            return () => { this.listeners = this.listeners.filter(l => l !== callback); };
        }

        notify() {
            this.listeners.forEach(l => l(this.entries));
        }
    }

    // --- Main Clock Class ---
    class StreamReadyAbacusClock {
        constructor(container) {
            this.container = container;
            this.masterTick = 0;
            this.offset = 0;
            this.isRunning = true;
            this.speed = 100;
            this.timer = null;
            this.streamTracer = new StreamTracer(60);
            this.lastTickWasLogged = false;
            this.sessionActive = true;

            this.updateUI = this.updateUI.bind(this);
            this.tickStep = this.tickStep.bind(this);

            // Emit initial BOM on session start
            setTimeout(() => this.emitBOM(), 100);
            this.init();
        }

        get federatedTick() { return (this.masterTick + this.offset) % MASTER_PERIOD; }

        // --- Stream Protocol Emitters ---
        emitBOM() {
            this.streamTracer.addEntry('BOM', null, this.federatedTick);
            this.sessionActive = true;
            this.updateUI();
        }

        emitNULL() {
            this.streamTracer.addEntry('NULL', null, this.federatedTick);
            this.updateUI();
        }

        emitESC() {
            this.streamTracer.addEntry('ESC', null, this.federatedTick);
            this.updateUI();
        }

        emitSignal(signalType, payload) {
            this.streamTracer.addSignal(signalType, payload, this.federatedTick);
            this.updateUI();
        }

        emitSessionReset() {
            this.streamTracer.addEntry('BOM', { reset: true }, this.federatedTick);
            this.updateUI();
        }

        // Generate signal payload from current clock state (example: sonar/fano snapshot)
        getCurrentSignalPayload() {
            const tick = this.federatedTick;
            const wallis = getWallisDecomp(tick);
            return {
                type: 'STATE_SNAPSHOT',
                tick,
                wallis: { dp: wallis.dp, p: wallis.p, u: wallis.u },
                sonarPhase: tick % SONAR_PERIOD,
                fanoPhase: tick % FANO_PERIOD,
                coherence: this.getCoherence(tick)
            };
        }

        getCoherence(tick) {
            const sPhase = tick % SONAR_PERIOD;
            const fPhase = tick % FANO_PERIOD;
            const diff = Math.abs((sPhase * FANO_PERIOD) - (fPhase * SONAR_PERIOD)) % 420;
            return 1.0 - (diff / 420);
        }

        init() {
            this.render();
            this.startClock();
        }

        tickStep() {
            if (!this.isRunning) return;
            this.masterTick = (this.masterTick + 1) % MASTER_PERIOD;

            // Protocol: Emit NULL on every clock tick (pure timing pulse)
            this.emitNULL();

            // Optional: Every 60 ticks, emit ESC + signal to demonstrate signal layer
            if (this.federatedTick % 60 === 0 && this.federatedTick > 0) {
                this.emitESC();
                this.emitSignal('HEARTBEAT', this.getCurrentSignalPayload());
            }

            // Every 504 ticks (1/10 of master), emit a session keep-alive BOM
            if (this.federatedTick % 504 === 0 && this.federatedTick > 0) {
                this.emitBOM(); // session boundary refresh
            }

            this.updateUI();
        }

        startClock() {
            if (this.timer) clearInterval(this.timer);
            this.timer = setInterval(() => this.tickStep(), this.speed);
        }

        stopClock() {
            if (this.timer) clearInterval(this.timer);
            this.timer = null;
        }

        setRunning(run) {
            this.isRunning = run;
            if (run) this.startClock();
            else this.stopClock();
            this.updateUI();
        }

        setSpeed(val) {
            this.speed = val;
            if (this.isRunning) { this.stopClock(); this.startClock(); }
            this.updateUI();
        }

        setOffset(val) {
            this.offset = Math.max(0, Math.min(MASTER_PERIOD - 1, val));
            this.updateUI();
        }

        resetClock() {
            this.masterTick = 0;
            this.emitSessionReset();
            this.updateUI();
        }

        getDerived() {
            const displayTick = this.federatedTick;
            const phase = displayTick % SONAR_PERIOD;
            const channel = Math.floor(phase / 15);
            const lane = phase % 15;
            const fanoPhase = displayTick % FANO_PERIOD;
            const triplet = FANO_LINES[fanoPhase];
            const wallis = getWallisDecomp(displayTick);
            const seed = (lane * 3 + fanoPhase * 2) % 256;

            let projectionChar = "⚛️";
            let projectionSub = "ABACUS";
            switch(channel) {
                case 0: projectionChar = (seed % 16).toString(16).toUpperCase(); projectionSub = `HEX_${seed}`; break;
                case 1: projectionChar = toBraille6(seed); projectionSub = `BRAILLE6_${seed}`; break;
                case 2: projectionChar = toBraille8(seed); projectionSub = `BRAILLE8_${seed}`; break;
                case 3: projectionChar = toHexagram(seed); projectionSub = `HEXAGRAM_${seed % 64}`; break;
            }

            const alignment = this.getCoherence(displayTick);
            const goalProgress = (displayTick % GOAL_CYCLE) / GOAL_CYCLE;

            return { masterTick: this.masterTick, federatedTick: this.federatedTick, offset: this.offset,
                     displayTick, wallis, sonar: { phase, channel, lane }, fano: { phase: fanoPhase, triplet },
                     alignment, goalProgress, projectionChar, projectionSub, isFederated: this.offset !== 0 };
        }

        renderAbacusBeads(value) {
            const activeCount = Math.min(59, value);
            let beads = '';
            for (let i = 0; i < 60; i++) {
                beads += `<div class="w-3 h-3 rounded-full transition-all duration-150 ${i < activeCount ? 'bg-emerald-500/70 shadow-sm' : 'bg-gray-700/30'}"></div>`;
            }
            return beads;
        }

        renderStreamLog(entries) {
            if (!entries || entries.length === 0) return '<div class="text-slate-600 italic text-center py-8">No stream events yet. Clock running...</div>';
            return entries.map(e => {
                let bgClass = '', icon = '', label = '';
                switch(e.type) {
                    case 'BOM': bgClass = 'bg-purple-900/40 border-purple-500/50'; icon = '🔷'; label = 'BOM';
                        break;
                    case 'NULL': bgClass = 'bg-emerald-900/30 border-emerald-500/40'; icon = '⏱️'; label = 'NULL';
                        break;
                    case 'ESC': bgClass = 'bg-amber-900/30 border-amber-500/40'; icon = '⚠️'; label = 'ESC';
                        break;
                    case 'SIGNAL': bgClass = 'bg-cyan-900/30 border-cyan-500/40'; icon = '📡'; label = 'SIGNAL';
                        break;
                    default: bgClass = 'bg-gray-800/30';
                }
                const detail = e.type === 'SIGNAL' ? `${e.data?.type || 'unknown'} → ${JSON.stringify(e.data?.payload).slice(0, 60)}` : (e.type === 'BOM' ? 'Session Boundary' : '');
                return `
                    <div class="${bgClass} border-l-4 p-2 mb-1 rounded-r text-[9px] font-mono">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-[10px] font-bold">${icon} ${label}</span>
                            <span class="text-slate-400">${e.timestamp}</span>
                            <span class="text-slate-500">Tick:${e.tick ?? '—'}</span>
                            <span class="text-[8px] text-slate-500">${e.utf32Hex}</span>
                        </div>
                        ${detail ? `<div class="text-cyan-300/80 text-[8px] mt-1 truncate">${detail}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        renderDOM(data, streamEntries) {
            const { masterTick, federatedTick, offset, displayTick, wallis, sonar, fano, alignment, goalProgress, projectionChar, projectionSub, isFederated } = data;
            const coherencePct = Math.floor(alignment * 100);
            const isHighCoherence = alignment > 0.85;

            const html = `
                <div class="max-w-7xl mx-auto px-4 py-6 w-full">
                    <!-- Header -->
                    <div class="flex flex-wrap justify-between items-center gap-4 border-b border-indigo-900/50 pb-5 mb-5">
                        <div class="flex items-center gap-3">
                            <span class="text-4xl aegean-text text-blue-400">${toAegeanTally(wallis.dp % 60)}</span>
                            <div><div class="text-[8px] font-black tracking-[0.3em] text-indigo-400/60">STREAM-READY CLOCK</div>
                            <div class="text-lg font-mono font-bold">${wallis.dp}‵‵ ${wallis.p}‵</div></div>
                        </div>
                        <div class="text-center">
                            <h1 class="text-[10px] font-black tracking-[0.4em] text-cyan-400/50">UTF-32 SIGNALING LAYER</h1>
                            <p class="text-[8px] font-mono text-emerald-400/70">BOM | NULL | ESC | STREAM PROTOCOL</p>
                        </div>
                        <div class="flex items-center gap-2">
                            ${isFederated ? '<span class="px-2 py-0.5 bg-purple-500/30 rounded text-[9px]">FEDERATED</span>' : ''}
                            <span class="text-3xl aegean-text text-emerald-400">${toAegeanTally(wallis.u)}</span>
                        </div>
                    </div>

                    <!-- Two-column: Left Clock Display + Right Stream Log -->
                    <div class="grid lg:grid-cols-3 gap-6">
                        <!-- LEFT: Clock Core (2 cols) -->
                        <div class="lg:col-span-2 space-y-5">
                            <!-- Abacus -->
                            <div class="bg-black/40 rounded-2xl p-4 border border-white/5">
                                <div class="text-[9px] text-slate-400 mb-2 uppercase tracking-wider">Sexagesimal Abacus (base-60)</div>
                                <div class="grid grid-cols-3 gap-3">
                                    <div><div class="text-[8px] text-indigo-400">DOUBLE PRIME</div><div class="flex flex-wrap gap-1 mt-1">${this.renderAbacusBeads(wallis.dp % 60)}</div><div class="text-right text-[9px] mt-1">${wallis.dp}</div></div>
                                    <div><div class="text-[8px] text-cyan-400">PRIME</div><div class="flex flex-wrap gap-1 mt-1">${this.renderAbacusBeads(wallis.p)}</div><div class="text-right text-[9px] mt-1">${wallis.p}</div></div>
                                    <div><div class="text-[8px] text-emerald-400">UNIT</div><div class="flex flex-wrap gap-1 mt-1">${this.renderAbacusBeads(wallis.u)}</div><div class="text-right text-[9px] mt-1">${wallis.u}</div></div>
                                </div>
                            </div>

                            <!-- Projection Glyph -->
                            <div class="relative bg-black/30 rounded-2xl border border-white/10 p-8 text-center">
                                <div class="text-[25vh] leading-none font-mono ${isHighCoherence ? 'drop-shadow-[0_0_30px_rgba(59,130,246,0.5)]' : ''}">${projectionChar}</div>
                                <div class="inline-block mt-2 bg-white/10 px-4 py-1 rounded-full text-sm font-mono">${projectionSub}</div>
                                <div class="flex justify-center gap-4 mt-3 text-[9px] text-slate-400">Channel ${sonar.channel} | Lane ${sonar.lane} | Fano ${fano.phase}/6 | Coherence ${coherencePct}%</div>
                                <!-- Sonar sweep bar -->
                                <div class="absolute bottom-0 left-0 w-full h-1 bg-white/10"><div class="h-full bg-emerald-500 transition-all" style="width: ${(sonar.phase / SONAR_PERIOD) * 100}%"></div></div>
                            </div>

                            <!-- Controls -->
                            <div class="flex flex-wrap gap-3 items-center">
                                <button id="playPauseBtn" class="px-4 py-2 rounded-lg text-sm font-bold ${this.isRunning ? 'bg-amber-600' : 'bg-blue-600'}">${this.isRunning ? '⏸ HALT' : '▶ START'}</button>
                                <button id="resetBtn" class="px-3 py-2 bg-slate-800 rounded-lg text-xs">⟳ RESET</button>
                                <input type="range" id="speedSlider" min="30" max="400" value="${this.speed}" class="w-28">
                                <span class="text-[10px]">${this.speed}ms/tick</span>
                                <div class="flex items-center gap-2 ml-auto">
                                    <span class="text-[9px] text-purple-400">OFFSET</span>
                                    <input type="range" id="offsetSlider" min="0" max="${MASTER_PERIOD-1}" value="${offset}" class="w-32">
                                    <span class="text-[9px]">+${offset}</span>
                                </div>
                            </div>

                            <!-- Federation Metadata -->
                            <div class="grid grid-cols-3 gap-2 text-center text-[9px] p-2 bg-slate-900/30 rounded-lg">
                                <div><span class="text-slate-500">MASTER</span><br><span class="font-mono">${masterTick}</span></div>
                                <div><span class="text-slate-500">FEDERATED</span><br><span class="font-mono text-emerald-400">${federatedTick}</span></div>
                                <div><span class="text-slate-500">GOAL</span><br><span class="font-mono">${Math.floor(goalProgress * 360)}°</span></div>
                            </div>
                        </div>

                        <!-- RIGHT: Stream Tracer Log -->
                        <div class="bg-gray-950/80 border border-purple-900/40 rounded-2xl p-3 flex flex-col h-[600px]">
                            <div class="flex justify-between items-center mb-3 pb-2 border-b border-purple-800/30">
                                <span class="text-[10px] font-black tracking-wider text-purple-400 flex items-center gap-2"><span>📡</span> UTF-32 STREAM TRACER</span>
                                <div class="flex gap-2">
                                    <button id="emitSignalBtn" class="text-[8px] px-2 py-0.5 bg-cyan-800/40 rounded hover:bg-cyan-700/60">📨 SEND SIGNAL</button>
                                    <button id="clearLogBtn" class="text-[8px] px-2 py-0.5 bg-gray-700 rounded">🗑 CLEAR</button>
                                </div>
                            </div>
                            <div class="flex-1 overflow-y-auto stream-log space-y-1" id="streamLogContainer">
                                ${this.renderStreamLog(streamEntries)}
                            </div>
                            <div class="mt-2 text-[7px] text-slate-500 text-center border-t border-purple-900/30 pt-2">
                                PROTOCOL: BOM=Session ● NULL=Tick ● ESC+Signal=Payload ● UTF-32 LE/BE
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 text-center text-[8px] text-slate-600 border-t border-white/5 pt-4">
                        STREAM-READY WALLIS CLOCK • BOM/NULL/ESC SIGNALING • UTF-32 COMPATIBLE • FEDERATION READY
                    </div>
                </div>
            `;

            this.container.innerHTML = html;

            // Bind events
            document.getElementById('playPauseBtn')?.addEventListener('click', () => this.setRunning(!this.isRunning));
            document.getElementById('resetBtn')?.addEventListener('click', () => this.resetClock());
            document.getElementById('speedSlider')?.addEventListener('input', (e) => this.setSpeed(parseInt(e.target.value)));
            document.getElementById('offsetSlider')?.addEventListener('input', (e) => this.setOffset(parseInt(e.target.value)));
            document.getElementById('emitSignalBtn')?.addEventListener('click', () => {
                this.emitESC();
                this.emitSignal('MANUAL', { timestamp: Date.now(), user: true, tick: this.federatedTick });
            });
            document.getElementById('clearLogBtn')?.addEventListener('click', () => this.streamTracer.clear());

            if (window.lucide) window.lucide.createIcons();
        }

        updateUI() {
            const data = this.getDerived();
            this.renderDOM(data, this.streamTracer.entries);
        }

        render() { this.updateUI(); }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('root');
        if (container) window.appClock = new StreamReadyAbacusClock(container);
        if (window.lucide) window.lucide.createIcons();
    });
</script>
</body>
</html>
