<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOLOG Scene</title>
  <style>
    body { margin: 0; padding: 0; font-family: "JetBrains Mono", monospace; background: #0d1117; color: #e6edf3; }
    #header { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    #header h1 { margin: 0; font-size: 18px; color: #58a6ff; }
    select, button { padding: 6px 12px; border-radius: 6px; background: #21262d; color: #e6edf3; border: 1px solid #30363d; cursor: pointer; font-size: 13px; }
    button:hover { background: #30363d; }
    #container { height: calc(100vh - 250px); width: 100%; }
    #scene-panel { height: 200px; border-top: 1px solid #30363d; display: flex; background: #0d1117; }
    #scene-inspector { flex: 1; padding: 10px; overflow: auto; font-size: 12px; }
    #frame-list, #viewport-info { width: 250px; border-left: 1px solid #30363d; padding: 10px; overflow: auto; }
    .section-title { color: #8b949e; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; }
    .info { position: absolute; bottom: 10px; left: 10px; font-size: 12px; color: #8b949e; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header">
    <h1>WOLOG Scene</h1>
    <select id="renderer-select">
      <option value="svg">SVG Renderer</option>
      <option value="canvas">Canvas Renderer</option>
    </select>
    <select id="view-select">
      <option value="live">Live World</option>
      <option value="frame">Frozen Frame</option>
      <option value="diff">Compare</option>
    </select>
    <button id="stepBtn">Step</button>
    <button id="resetBtn">Reset</button>
    <button id="captureBtn">Capture Frame</button>
  </div>

  <div id="container"></div>

  <div id="scene-panel">
    <div id="scene-inspector">
      <div class="section-title">Scene State</div>
      <pre id="scene-json"></pre>
    </div>
    <div id="frame-list">
      <div class="section-title">Captured Frames</div>
      <div id="frames"></div>
    </div>
    <div id="viewport-info">
      <div class="section-title">Viewport</div>
      <pre id="viewport-json"></pre>
    </div>
  </div>

  <div class="info">WOLOG: scene inspector</div>

  <script type="module" src="/apps/scene.ts"></script>
</body>
</html>
