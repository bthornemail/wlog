<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wormhole Federation Hub | Web Component Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wormhole-active { animation: wormholePulse 2s ease-in-out infinite; }
        @keyframes wormholePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.8); }
        }
        .peer-card { transition: all 0.2s ease; }
        .peer-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950/20 to-slate-950 min-h-screen p-6 font-mono">

<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">WORMHOLE FEDERATION HUB</h1>
        <p class="text-slate-400 text-sm mt-2">Web Components + CRDT + BroadcastChannel</p>
    </div>

    <!-- Control Bar -->
    <div class="bg-black/40 backdrop-blur rounded-2xl p-4 mb-6 border border-purple-500/30">
        <div class="flex flex-wrap gap-4 items-center justify-between">
            <div class="flex gap-3">
                <button id="addFrameBtn" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-sm font-bold transition flex items-center gap-2">
                    ➕ Spawn Node
                </button>
                <button id="broadcastSyncBtn" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded-lg text-sm font-bold transition">
                    📡 Sync All
                </button>
                <button id="resetAllBtn" class="px-4 py-2 bg-amber-600/50 hover:bg-amber-600 rounded-lg text-sm transition">
                    🔄 Reset
                </button>
            </div>
            <div class="flex items-center gap-3 text-xs">
                <span class="flex items-center gap-1">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> 
                    Nodes: <span id="nodeCount">0</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Using Web Components -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6" id="nodeGrid">
        <!-- Nodes injected here with web components -->
    </div>

    <!-- Hub Log -->
    <div class="bg-black/40 backdrop-blur rounded-2xl border border-purple-500/20 overflow-hidden">
        <div class="px-4 py-3 border-b border-purple-500/20 flex justify-between items-center">
            <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">🌀 Hub Activity</span>
            <button id="clearLogBtn" class="text-[9px] px-2 py-1 bg-slate-800 rounded hover:bg-slate-700">Clear</button>
        </div>
        <div id="hubLog" class="h-32 overflow-y-auto p-3 space-y-1 font-mono text-[9px] text-slate-400">
            <div class="text-slate-500 italic">Click "Spawn Node" to add clocks...</div>
        </div>
    </div>
</div>

<!-- Load Web Components -->
<script src="components/clock-node.js" type="module"></script>

<script type="module">
    // Import web components
    import './components/clock-node.js';
    
    // Hub state
    const nodeGrid = document.getElementById('nodeGrid');
    const nodeCount = document.getElementById('nodeCount');
    const hubLog = document.getElementById('hubLog');
    const nodes = [];
    let nodeId = 0;
    
    // BroadcastChannel for federation
    const channel = new BroadcastChannel('wlog-federation');
    
    channel.onmessage = (e) => {
        if (e.data.type === 'SYNC') {
            log('FEDERATION', `Global sync: tick=${e.data.tick}`);
            nodes.forEach(n => {
                n.clock.tick = e.data.tick;
            });
        }
    };
    
    function log(source, msg) {
        const entry = document.createElement('div');
        entry.className = 'log-entry flex gap-2';
        entry.innerHTML = `<span class="text-purple-400">[${source}]</span><span>${msg}</span>`;
        hubLog.insertBefore(entry, hubLog.firstChild);
        while (hubLog.children.length > 30) hubLog.lastChild.remove();
    }
    
    function addNode() {
        nodeId++;
        const offset = (nodeId - 1) * 840;
        
        // Create web component
        const clock = document.createElement('wlog-clock-node');
        clock.setAttribute('offset', offset);
        clock.setAttribute('label', 'NODE' + nodeId);
        
        // Listen to ticks
        clock.addEventListener('tick', (e) => {
            log(e.detail.nodeId, `tick ${e.detail.federatedTick}`);
        });
        
        nodeGrid.appendChild(clock);
        nodes.push({ element: clock, clock: clock });
        
        nodeCount.textContent = nodes.length;
        log('HUB', `Added node ${nodeId} (offset: ${offset})`);
    }
    
    function removeNode() {
        if (nodes.length === 0) return;
        const node = nodes.pop();
        node.element.remove();
        nodeId--;
        nodeCount.textContent = nodes.length;
        log('HUB', 'Removed node');
    }
    
    function resetAll() {
        nodes.forEach(n => n.element.remove());
        nodes.length = 0;
        nodeId = 0;
        nodeCount.textContent = 0;
        hubLog.innerHTML = '<div class="text-slate-500 italic">Click "Spawn Node" to add clocks...</div>';
        log('HUB', 'Reset complete');
    }
    
    function broadcastSync() {
        const masterTick = nodes[0]?.clock.tick || 0;
        channel.postMessage({ type: 'SYNC', tick: masterTick });
        log('FEDERATION', `Broadcast sync: tick=${masterTick}`);
    }
    
    // Event listeners
    document.getElementById('addFrameBtn').onclick = addNode;
    document.getElementById('resetAllBtn').onclick = resetAll;
    document.getElementById('broadcastSyncBtn').onclick = broadcastSync;
    document.getElementById('clearLogBtn').onclick = () => {
        hubLog.innerHTML = '<div class="text-slate-500 italic">Log cleared...</div>';
    };
    
    // Add initial node
    addNode();
</script>

</body>
</html>
