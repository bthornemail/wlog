<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sexagesimal Wallis Clock | Web Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05050A; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0A0A12] text-gray-200 min-h-screen flex flex-col">

<header class="p-6 border-b border-purple-500/20">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">
        Sexagesimal Wallis Clock
    </h1>
    <p class="text-slate-400 text-sm mt-1">Base-60 abacus with Wallis decomposition • Web Component</p>
</header>

<div class="p-4 bg-black/20 border-b border-purple-500/20 flex flex-wrap gap-4 items-center">
    <button id="pauseBtn" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-sm">Pause</button>
    <button id="speedBtn" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded-lg text-sm">Speed: 100ms</button>
    <div class="flex-1"></div>
    <span id="tickDisplay" class="font-mono text-cyan-400">Tick: 0</span>
</div>

<main class="flex-1 p-4">
    <wlog-clock-node id="mainClock" offset="0" label="WALLIS"></wlog-clock-node>
</main>

<footer class="p-4 border-t border-purple-500/20 text-xs text-slate-500">
    <div class="grid grid-cols-3 gap-4">
        <div><div class="text-purple-400 mb-1">Units</div><div class="font-mono">0-59</div></div>
        <div><div class="text-cyan-400 mb-1">×60</div><div class="font-mono">0-59</div></div>
        <div><div class="text-indigo-400 mb-1">×3600</div><div class="font-mono">0-14</div></div>
    </div>
</footer>

<script src="components/clock-node.js"></script>
<script>
const clock = document.getElementById('mainClock');
const tickDisplay = document.getElementById('tickDisplay');
const pauseBtn = document.getElementById('pauseBtn');
const speedBtn = document.getElementById('speedBtn');
let speedIndex = 1;
const speeds = [50, 100, 200, 500, 1000];

clock.addEventListener('tick', (e) => {
    tickDisplay.textContent = `Tick: ${e.detail.federatedTick}`;
});

pauseBtn.onclick = () => { clock.isRunning = !clock.isRunning; pauseBtn.textContent = clock.isRunning ? 'Pause' : 'Resume'; };
speedBtn.onclick = () => { 
    speedIndex = (speedIndex + 1) % speeds.length; 
    clock.setAttribute('speed', speeds[speedIndex]);
    speedBtn.textContent = `Speed: ${speeds[speedIndex]}ms`;
};
</script>
</body>
</html>
